# =====================================================================
# nginx reverse proxy for Open WebUI
# =====================================================================
# Provides:
#   - HTTPS termination with self-signed cert
#   - Security headers (HSTS, frame options, etc.)
#   - Anti-brute-force rate limiting on the login endpoint specifically
#   - WebSocket support for streaming chat responses
#   - Generous file upload limit for RAG documents
#
# IMPORTANT: rate limiting is applied ONLY to the login endpoint, not
# the main location. Open WebUI fires 30-50 parallel requests on page
# load (JS chunks, fonts, favicons, websocket) and a tight rate limit
# blocks legitimate page loads with 503s.
# =====================================================================

# Rate limit zone — kept defined so we can selectively apply to sensitive
# endpoints. Not applied globally for the reasons noted above.
limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost;

    # TLS — self-signed cert generated via openssl, 4096-bit RSA, 10 year validity
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers — defense-in-depth even though this is local
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow file uploads up to 100MB for RAG documents, images, etc.
    # Default nginx limit is 1MB which fails immediately on any real PDF.
    client_max_body_size 100M;

    # Main proxy — UI, static assets, API, and websockets all go through here.
    # No rate limit. Auth is enforced by Open WebUI itself (WEBUI_AUTH=true).
    location / {
        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;

        # WebSocket upgrade headers — required for Open WebUI's streaming chat
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard reverse-proxy headers so Open WebUI sees the real client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts for slow model responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Login endpoint — rate-limited to make brute-force attempts impractical.
    # 10/s with burst of 10 is plenty for a real human typing a password,
    # but kills any rapid-fire credential stuffing attempt.
    location /api/v1/auths/signin {
        limit_req zone=llm_limit burst=10 nodelay;

        proxy_pass http://open-webui:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
